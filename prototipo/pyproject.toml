[project]
name = "ruta-dia-agents"
version = "0.1.0"
description = "Nucleo multiagente verificable para acompañar rutas de innovacion."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai[google-genai]==1.15.20",
  "fastapi>=0.115,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "openai>=2,<3",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
ruta-dia = "ruta_dia_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ruta_dia_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
