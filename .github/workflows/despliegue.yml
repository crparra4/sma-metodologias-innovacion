# Despliegue continuo de Hilo: cuando el CI pasa en `main`, construye la imagen, la publica en
# GitHub Container Registry y la pone en marcha en la VPS. Configuración única (llave SSH,
# secretos, entorno «produccion») en docs/despliegue-automatico.md.
#
# Para volver a una versión anterior: Actions → «Despliegue» → Run workflow, con la etiqueta
# (sha-xxxxxxx) en «version». Sin etiqueta, construye y despliega lo último de main.
name: Despliegue

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Etiqueta ya publicada (sha-xxxxxxx) para volver a ella; vacío = construir main"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  imagen:
    name: Construir y publicar la imagen
    # Solo un CI exitoso de un push a main, o a mano desde main sin etiqueta.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && inputs.version == ''
        && github.ref == 'refs/heads/main')
    # La VPS es ARM64: se construye en un runner ARM, sin emulación.
    runs-on: ${{ vars.HILO_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.nombre.outputs.version }}
    steps:
      - name: Versión a publicar
        id: nombre
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=sha-${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.nombre.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ vars.HILO_PLATAFORMA || 'linux/arm64' }}
          push: true
          tags: |
            ${{ steps.nombre.outputs.imagen }}:${{ steps.nombre.outputs.version }}
            ${{ steps.nombre.outputs.imagen }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.nombre.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Desplegar en la VPS
    needs: imagen
    # También corre sin construir cuando se pidió volver a una etiqueta anterior.
    if: >-
      always()
      && (needs.imagen.result == 'success'
        || (github.event_name == 'workflow_dispatch' && inputs.version != ''
          && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    # El entorno guarda los secretos de la VPS y puede pedir aprobación antes de desplegar.
    environment: produccion
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Preparar la conexión SSH
        env:
          LLAVE: ${{ secrets.VPS_SSH_KEY }}
          HUELLAS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          [ -n "$LLAVE" ] && [ -n "$HUELLAS" ] || { echo "Faltan VPS_SSH_KEY o VPS_KNOWN_HOSTS."; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$LLAVE" > ~/.ssh/despliegue && chmod 600 ~/.ssh/despliegue
          # Huella fija del servidor: si cambia, la conexión se rechaza.
          printf '%s\n' "$HUELLAS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      - name: Desplegar
        env:
          VERSION: ${{ inputs.version || needs.imagen.outputs.version }}
          HOST: ${{ secrets.VPS_HOST }}
          USUARIO: ${{ secrets.VPS_USER }}
          PUERTO: ${{ secrets.VPS_PORT || '22' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$VERSION" =~ ^sha-[0-9a-f]{7,40}$ ]] || { echo "Versión no válida: $VERSION"; exit 1; }
          # La llave solo puede correr ~/hilo/desplegar.sh; el token (temporal) va por stdin.
          printf '%s\n' "$TOKEN" | ssh -i ~/.ssh/despliegue -p "$PUERTO" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$USUARIO@$HOST" "desplegar $VERSION $GITHUB_ACTOR"
      - name: Resumen
        if: always()
        env:
          VERSION: ${{ inputs.version || needs.imagen.outputs.version }}
        run: |
          echo "### Despliegue de \`$VERSION\`: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Para volver atrás: Run workflow con la etiqueta anterior." >> "$GITHUB_STEP_SUMMARY"
